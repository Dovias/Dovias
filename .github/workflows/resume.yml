name: Compile Resume
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Create Output Directory
        run: mkdir output

      - name: Compile PDF
        run: typst compile src/document.typ output/resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: output/resume.pdf
