name: Compile Resume
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Create Output Directory
        run: mkdir resume/output

      - name: Compile PDF
        run: typst compile resume/src/document.typ resume/output/resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/output/resume.pdf
